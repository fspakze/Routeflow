<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#ea580c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="RouteFlow" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="icon" href="icon.svg" />
<title>RouteFlow — จัดการร้านค้า</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{--bg:#fff7ed;--card:#fff;--line:#fed7aa;--ink:#1f2937;--muted:#6b7280;--brand:#ea580c;--ok:#0f9d58;--bad:#dc2626}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:"Segoe UI","Noto Sans Lao","Noto Sans Thai",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
  #app{height:100%;display:flex;flex-direction:column}
  /* gate */
  #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#fff7ed,#ffedd5);z-index:2000;padding:16px}
  #gate .box{background:var(--card);border:1px solid var(--line);border-radius:16px;max-width:420px;width:100%;padding:24px;box-shadow:0 10px 40px rgba(234,88,12,.12)}
  #gate h1{margin:0 0 4px;font-size:20px}#gate p{margin:0 0 16px;color:var(--muted);font-size:13px}
  label.fl{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}
  input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-size:14px;outline:none;background:#fff;font-family:inherit}
  input:focus,select:focus,textarea:focus{border-color:var(--brand)}
  #gate button{width:100%;margin-top:16px;padding:11px;border:0;border-radius:10px;background:var(--brand);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  .err{color:var(--bad);font-size:13px;margin-top:8px;min-height:16px}
  header{display:flex;align-items:center;gap:12px;padding:9px 14px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
  header .logo{font-weight:800;color:var(--brand);font-size:16px}
  header .me{font-size:12px;color:var(--muted);margin-left:auto}
  .btn{padding:9px 16px;border:0;border-radius:9px;background:var(--brand);color:#fff;font-weight:600;cursor:pointer;font-size:14px}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:500}
  .btn.sm{padding:6px 11px;font-size:12px}
  a.btn{text-decoration:none;display:inline-block}
  .wrap{flex:1;min-height:0;display:grid;grid-template-columns:300px 1fr}
  /* list */
  #side{border-right:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;min-height:0}
  #side .top{padding:10px;border-bottom:1px solid var(--line)}
  #list{overflow:auto;flex:1}
  .item{padding:9px 12px;border-bottom:1px solid #f3e8dd;cursor:pointer;font-size:13px}
  .item:hover{background:var(--bg)}.item.sel{background:#ffedd5}
  .item .n{font-weight:600}.item .c{color:var(--muted);font-size:11px}
  .badge{font-size:10px;padding:1px 6px;border-radius:99px;background:#dcfce7;color:#166534;margin-left:4px}
  /* detail */
  #detail{overflow:auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  .card h3{margin:0 0 12px;font-size:14px;color:var(--brand)}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .grid.two{grid-template-columns:1fr 1fr}
  .full{grid-column:1/-1}
  #pickMap{height:260px;border-radius:10px;border:1px solid var(--line)}
  .map-hold{position:relative}
  .map-fs-btn{position:absolute;top:8px;left:8px;z-index:500;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  .map-fs{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;z-index:4000;border-radius:0!important;margin:0!important}
  .map-fs-close{position:fixed;top:12px;left:12px;z-index:4001;background:#111827;color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:15px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer}
  .coordbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
  .coordbar .now{font-size:12px;color:var(--muted);font-family:monospace}
  @media(max-width:820px){#pickMap{height:300px}}
  .photos{display:flex;gap:10px;flex-wrap:wrap}
  .ph{width:120px}
  .ph img{width:120px;height:120px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:#f3e8dd}
  .ph .cap{font-size:11px;color:var(--muted);text-align:center;margin-top:2px}
  .ph .del{font-size:11px;color:var(--bad);cursor:pointer;text-align:center}
  .ordrow{display:flex;gap:8px;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px solid #f3e8dd}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;z-index:3000;opacity:0;transition:.3s;pointer-events:none}
  .toast.show{opacity:1}
  .muted{color:var(--muted)}
  @media(max-width:820px){.wrap{grid-template-columns:1fr}.grid,.grid.two{grid-template-columns:1fr 1fr}#side{max-height:38vh}}
  @media(max-width:560px){.grid,.grid.two{grid-template-columns:1fr!important}#side{max-height:34vh}}
  @media(max-width:700px){.btn,input,select,textarea{min-height:44px}.btn.sm{min-height:36px}}
</style>
</head>
<body>
<div id="app">
  <div id="gate"><div class="box">
    <h1>🏪 จัดการร้านค้า</h1><p>เข้าสู่ระบบ</p>
    <label class="fl">ไอดี หรือ อีเมล</label><input id="email" type="text" autocapitalize="off" spellcheck="false">
    <label class="fl">รหัสผ่าน</label><input id="password" type="password">
    <button id="loginBtn">เข้าสู่ระบบ</button>
    <div class="err" id="gerr"></div>
  </div></div>

  <header style="display:none" id="bar">
    <a href="index.html" class="logo" style="text-decoration:none;color:var(--brand)" title="กลับหน้าหลัก">🏪 RouteFlow ร้านค้า</a>
    <a href="map.html" class="btn ghost sm">🗺️ แผนที่</a>
    <a href="admin.html" class="btn ghost sm">📋 วางแผน</a>
    <span class="me" id="me"></span>
    <button class="btn ghost sm" id="logoutBtn">ออก</button>
  </header>

  <div class="wrap" id="wrap" style="display:none">
    <div id="side">
      <div class="top">
        <button class="btn sm" id="newBtn" style="width:100%">+ เพิ่มร้านใหม่</button>
        <input id="q" placeholder="ค้นหาชื่อ / รหัส / เบอร์โทร" style="margin-top:8px">
        <select id="catFilter" style="margin-top:8px"><option value="">— ทุกหมวด —</option></select>
        <div class="muted" style="font-size:11px;margin-top:6px" id="count"></div>
      </div>
      <div id="list"></div>
    </div>

    <div id="detail"><div class="muted">เลือกร้านจากรายการ หรือกด "เพิ่มร้านใหม่"</div></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const LS={url:'rf_sb_url',key:'rf_sb_key'};
let sb=null,me=null,rows=[],cur=null,pickMap=null,pickMarker=null,cats=[];

$('#loginBtn').onclick=login;$('#password').addEventListener('keydown',e=>{if(e.key==='Enter')login();});

const RF_DOMAIN='routeflow.local';
function idToEmail(v){v=(v||'').trim().toLowerCase();return v?(v.includes('@')?v:v.replace(/\s+/g,'')+'@'+RF_DOMAIN):'';}
async function login(){
  const url=window.RF_CONFIG&&RF_CONFIG.url,key=window.RF_CONFIG&&RF_CONFIG.anonKey,email=idToEmail($('#email').value),pw=$('#password').value;
  $('#gerr').textContent='';if(!url||!key){$('#gerr').textContent='config.js ไม่ถูกโหลด';return;}
  if(!email||!pw){$('#gerr').textContent='กรอกอีเมล+รหัสผ่าน';return;}
  $('#loginBtn').disabled=true;$('#loginBtn').textContent='กำลังเข้า...';
  try{
    sb=sb||supabase.createClient(url,key);
    const{error}=await sb.auth.signInWithPassword({email,password:pw});if(error)throw error;
    await proceed();
  }catch(e){$('#gerr').textContent='เข้าไม่สำเร็จ: '+(e.message||e);$('#loginBtn').disabled=false;$('#loginBtn').textContent='เข้าสู่ระบบ';}
}
async function proceed(){
  const{data:{user}}=await sb.auth.getUser();
  const{data:prof}=await sb.from('profiles').select('full_name,role').eq('id',user.id).maybeSingle();
  me={id:user.id,...(prof||{})};
  $('#me').textContent=prof?`${prof.full_name} · ${prof.role}`:'(ยังไม่มี profile)';
  $('#gate').style.display='none';$('#bar').style.display='flex';$('#wrap').style.display='grid';
  await loadList();
  const pid=new URLSearchParams(location.search).get('id');
  if(pid) await openStore(+pid);
}
$('#logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload();};
(async function boot(){
  if(!(window.RF_CONFIG&&window.supabase))return;
  sb=sb||supabase.createClient(RF_CONFIG.url,RF_CONFIG.anonKey);
  try{const{data:{session}}=await sb.auth.getSession();if(session)await proceed();}catch(e){}
})();

async function loadList(){
  const{data,error}=await sb.from('customers').select('id,name,code,category,phone,address,verified').order('name').limit(5000);
  if(error){toast('โหลดไม่ได้: '+error.message);return;}
  rows=data||[]; cats=[...new Set(rows.map(r=>r.category).filter(Boolean))].sort();
  const cf=$('#catFilter'), prev=cf.value;
  cf.innerHTML='<option value="">— ทุกหมวด —</option>'+cats.map(c=>{
    const n=rows.filter(r=>r.category===c).length;
    return `<option value="${esc(c)}">${esc(c)} (${n})</option>`;
  }).join('');
  cf.value=prev;
  renderList();
}
$('#q').addEventListener('input',renderList);
$('#catFilter').addEventListener('change',renderList);
function renderList(){
  const q=$('#q').value.trim().toLowerCase();
  const cat=$('#catFilter').value;
  const f=rows.filter(r=>
    (!q||(r.name||'').toLowerCase().includes(q)||(r.code||'').toLowerCase().includes(q)
        ||(r.phone||'').toLowerCase().includes(q)||(r.address||'').toLowerCase().includes(q)) &&
    (!cat||r.category===cat));
  $('#count').textContent=`${f.length} / ${rows.length} ร้าน`;
  $('#list').innerHTML=f.map(r=>`<div class="item ${cur&&cur.id===r.id?'sel':''}" data-id="${r.id}">
    <div class="n">${esc(r.name)} ${r.verified?'<span class="badge">✓</span>':''}</div>
    <div class="c">${esc(r.category||'')}${r.code?' · '+esc(r.code):''}</div></div>`).join('');
  $$('#list .item').forEach(el=>el.onclick=()=>openStore(+el.dataset.id));
}

async function openStore(id){
  const{data,error}=await sb.from('customers').select('*').eq('id',id).single();
  if(error){toast('โหลดร้านไม่ได้: '+error.message);return;}
  cur=data; renderList(); renderDetail(false);
}
function newStore(){
  cur={id:null,name:'',lat:15.115,lng:105.82,geofence_m:120,verified:false,is_active:true,source:'manual'};
  renderList(); renderDetail(true);
}
$('#newBtn').onclick=newStore;

function fld(id,label,val,type='text',ph=''){return `<div><label class="fl">${label}</label><input id="f_${id}" type="${type}" value="${val==null?'':esc(String(val))}" placeholder="${ph}"></div>`;}
function sel(id,label,val,opts){return `<div><label class="fl">${label}</label><select id="f_${id}">${['',...opts].map(o=>`<option ${String(val||'')===o?'selected':''}>${o}</option>`).join('')}</select></div>`;}

function renderDetail(isNew){
  const c=cur;
  $('#detail').innerHTML=`
   <div class="card">
     <h3>${isNew?'➕ ร้านใหม่':'✏️ แก้ไขร้าน'} </h3>
     <div class="grid">
       ${fld('name','ชื่อร้าน *',c.name)}
       ${fld('name_alt','ชื่อสำรอง (ไทย/อังกฤษ)',c.name_alt)}
       ${fld('code','รหัส (FS-)',c.code,'text','เชื่อม Friendship')}
       <div><label class="fl">หมวด</label><input id="f_category" list="catlist" value="${esc(c.category||'')}">
         <datalist id="catlist">${cats.map(x=>`<option>${esc(x)}</option>`).join('')}</datalist></div>
       ${sel('store_type','ประเภทร้าน',c.store_type,['โชห่วย','มินิมาร์ท','ร้านอาหาร','คาเฟ่','ค้าส่ง','อื่นๆ'])}
       ${sel('size_tier','ขนาด',c.size_tier,['เล็ก','กลาง','ใหญ่'])}
     </div>
   </div>

   <div class="card">
     <h3>👤 เจ้าของ / ติดต่อ</h3>
     <div class="grid">
       ${fld('owner_name','ชื่อเจ้าของ',c.owner_name)}
       ${fld('phone','เบอร์หลัก',c.phone)}
       ${fld('phone2','เบอร์สำรอง',c.phone2)}
       ${fld('line_id','LINE ID',c.line_id)}
     </div>
   </div>

   <div class="card">
     <h3>📍 ที่ตั้ง</h3>
     <div class="coordbar">
       <button class="btn" id="gpsBtn" style="flex:1;min-width:170px">📌 ใช้ตำแหน่งปัจจุบัน</button>
       <span class="now" id="coordNow">${c.lat!=null?(+c.lat).toFixed(5)+', '+(+c.lng).toFixed(5):'ยังไม่ปักหมุด'}</span>
     </div>
     <div class="muted" style="font-size:11px;margin:8px 0 6px">ยืนหน้าร้านแล้วกด "ใช้ตำแหน่งปัจจุบัน" · หรือกด ⛶ เปิดแผนที่เต็มจอเพื่อแตะปักหมุด</div>
     <div class="map-hold"><div id="pickMap"></div>
       <button type="button" class="map-fs-btn" id="pickFsBtn">⛶ เต็มจอ</button></div>
     <div class="grid" style="margin-top:10px">
       ${fld('lat','Lat',c.lat)} ${fld('lng','Lng',c.lng)} ${fld('geofence_m','รัศมี geofence (ม.)',c.geofence_m,'number')}
     </div>
     <div class="grid" style="margin-top:10px">
       ${fld('landmark','จุดสังเกต',c.landmark)}
       ${sel('vehicle_access','รถเข้าถึง',c.vehicle_access,['รถเก๋ง','กระบะ','รถ 6 ล้อ','มอเตอร์ไซค์เท่านั้น'])}
       ${fld('access_note','หมายเหตุการเข้าถึง',c.access_note,'text','ซอยแคบ/ทางลูกรัง')}
       ${fld('address','ที่อยู่',c.address)}
       ${fld('district','เมือง/อำเภอ',c.district)}
       ${fld('province','แขวง/จังหวัด',c.province)}
     </div>
   </div>

   <div class="card">
     <h3>🕐 เวลาทำการ / การค้า</h3>
     <div class="grid">
       ${fld('open_time','เวลาเปิด',c.open_time,'time')}
       ${fld('close_time','เวลาปิด',c.close_time,'time')}
       ${fld('closed_days','วันหยุด',c.closed_days,'text','อาทิตย์')}
       ${sel('payment_terms','การชำระ',c.payment_terms,['เงินสด','เครดิต','สด+เครดิต'])}
       ${fld('credit_days','เครดิต (วัน)',c.credit_days,'number')}
       ${fld('credit_limit','วงเงินเครดิต',c.credit_limit,'number')}
       ${sel('price_tier','ระดับราคา',c.price_tier,['ปกติ','ส่ง','สมาชิก','VIP'])}
       ${fld('credit_balance','ยอดค้าง (sync)',c.credit_balance,'number')}
       ${fld('last_order_date','ซื้อล่าสุด (sync)',c.last_order_date,'date')}
     </div>
     <div class="muted" style="font-size:11px;margin-top:6px">* ยอดซื้อรวม/เฉลี่ย/ค้าง จะ sync จาก Friendship ภายหลัง — แก้มือได้</div>
   </div>

   <div class="card">
     <h3>✅ สถานะ</h3>
     <div class="grid">
       <label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" id="f_verified" ${c.verified?'checked':''} style="width:auto"> ยืนยันข้อมูล/พิกัดแล้ว</label>
       <label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" id="f_is_active" ${c.is_active!==false?'checked':''} style="width:auto"> เปิดใช้งาน</label>
     </div>
   </div>

   <div class="card" style="display:flex;gap:10px;align-items:center">
     <button class="btn" id="saveBtn">💾 บันทึกร้าน</button>
     ${c.id?'<button class="btn ghost" id="delBtn">ลบร้าน</button>':''}
     <span class="err" id="serr" style="flex:1"></span>
   </div>

   ${c.id?`
   <div class="card">
     <h3>📷 รูปภาพ</h3>
     <div class="grid" style="grid-template-columns:1fr 1fr auto;align-items:end">
       ${sel('ptype','ประเภทรูป','storefront',['storefront','owner','interior','access','other'])}
       <div><label class="fl">เลือกรูป (ถ่ายได้)</label><input id="photoFile" type="file" accept="image/*" capture="environment"></div>
       <button class="btn sm" id="upBtn">อัปโหลด</button>
     </div>
     <div class="photos" id="photos" style="margin-top:12px"></div>
   </div>

   <div class="card">
     <h3>🧾 บันทึกการซื้อ/ส่ง</h3>
     <div class="grid" style="grid-template-columns:auto 1fr auto auto;align-items:end">
       ${fld('oDate','วันที่',new Date().toISOString().slice(0,10),'date')}
       ${fld('oAmt','ยอด (บาท/กีบ)','','number')}
       ${sel('oPay','ชำระ','paid',['paid','credit','partial'])}
       <button class="btn sm" id="addOrder">+ เพิ่ม</button>
     </div>
     <div style="margin-top:6px"><input id="f_oNote" placeholder="สรุปสินค้า (ถ้ามี)"></div>
     <div id="orders" style="margin-top:10px"></div>
   </div>`:''}
  `;
  setTimeout(()=>initPick(c),50);
  $('#gpsBtn').onclick=useGps;
  $('#pickFsBtn').onclick=()=>toggleMapFS(pickMap,'pickMap','pickFsBtn');
  $('#saveBtn').onclick=saveStore;
  if($('#delBtn'))$('#delBtn').onclick=delStore;
  if(c.id){ $('#upBtn').onclick=uploadPhoto; $('#addOrder').onclick=addOrder; loadPhotos(); loadOrders(); }
}

function initPick(c){
  if(pickMap){pickMap.remove();pickMap=null;}
  const lat=parseFloat($('#f_lat').value)||15.115, lng=parseFloat($('#f_lng').value)||105.82;
  pickMap=L.map('pickMap').setView([lat,lng],16);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OSM'}).addTo(pickMap);
  pickMarker=L.marker([lat,lng],{draggable:true}).addTo(pickMap);
  pickMarker.on('dragend',()=>{const p=pickMarker.getLatLng();setLL(p.lat,p.lng);});
  pickMap.on('click',e=>{pickMarker.setLatLng(e.latlng);setLL(e.latlng.lat,e.latlng.lng);});
  $('#f_lat').addEventListener('change',syncMarker);$('#f_lng').addEventListener('change',syncMarker);
}
function setLL(lat,lng){$('#f_lat').value=lat.toFixed(7);$('#f_lng').value=lng.toFixed(7);const n=$('#coordNow');if(n)n.textContent=lat.toFixed(5)+', '+lng.toFixed(5);}

/* เต็มจอแผนที่ — มือถือปักหมุดง่าย ไม่ชนกับการเลื่อนหน้า */
let _fsClose=null;
function toggleMapFS(mapObj,elId,btnId){
  const el=document.getElementById(elId); if(!el||!mapObj)return;
  const on=el.classList.toggle('map-fs');
  if(on){
    const b=document.createElement('button');
    b.className='map-fs-close'; b.textContent='✕ ปิดแผนที่'; b.id='mapFsClose';
    b.onclick=()=>toggleMapFS(mapObj,elId,btnId);
    document.body.appendChild(b); _fsClose=b;
    const pb=document.getElementById(btnId); if(pb)pb.style.display='none';
  }else{
    if(_fsClose){_fsClose.remove();_fsClose=null;}
    const pb=document.getElementById(btnId); if(pb)pb.style.display='';
  }
  setTimeout(()=>mapObj.invalidateSize(),200);
}
function syncMarker(){const lat=parseFloat($('#f_lat').value),lng=parseFloat($('#f_lng').value);if(!isNaN(lat)&&!isNaN(lng)){pickMarker.setLatLng([lat,lng]);pickMap.panTo([lat,lng]);}}
function useGps(){
  if(!navigator.geolocation){toast('อุปกรณ์ไม่รองรับ GPS');return;}
  toast('กำลังหาตำแหน่ง...');
  navigator.geolocation.getCurrentPosition(p=>{setLL(p.coords.latitude,p.coords.longitude);syncMarker();toast('ได้ตำแหน่งแล้ว');},
    e=>toast('หาตำแหน่งไม่ได้: '+e.message),{enableHighAccuracy:true,timeout:10000});
}

function val(id){const el=$('#f_'+id);if(!el)return null;if(el.type==='checkbox')return el.checked;const v=el.value.trim();return v===''?null:v;}
function num(id){const v=val(id);return v==null?null:parseFloat(v);}
async function saveStore(){
  $('#serr').textContent='';
  if(!val('name')){$('#serr').textContent='ใส่ชื่อร้าน';return;}
  const rec={
    name:val('name'),name_alt:val('name_alt'),code:val('code'),category:val('category'),
    store_type:val('store_type'),size_tier:val('size_tier'),owner_name:val('owner_name'),
    phone:val('phone'),phone2:val('phone2'),line_id:val('line_id'),
    lat:num('lat'),lng:num('lng'),geofence_m:num('geofence_m')||120,
    landmark:val('landmark'),vehicle_access:val('vehicle_access'),access_note:val('access_note'),
    address:val('address'),district:val('district'),province:val('province'),
    open_time:val('open_time'),close_time:val('close_time'),closed_days:val('closed_days'),
    payment_terms:val('payment_terms'),credit_days:num('credit_days'),credit_limit:num('credit_limit'),
    price_tier:val('price_tier'),credit_balance:num('credit_balance'),last_order_date:val('last_order_date'),
    verified:val('verified'),is_active:val('is_active'),updated_by:me.id,updated_at:new Date().toISOString()
  };
  if(rec.verified&&!cur.verified){rec.verified_by=me.id;rec.verified_at=new Date().toISOString();}
  $('#saveBtn').disabled=true;$('#saveBtn').textContent='กำลังบันทึก...';
  try{
    if(cur.id){const{error}=await sb.from('customers').update(rec).eq('id',cur.id);if(error)throw error;toast('✅ บันทึกแล้ว');}
    else{rec.source=rec.source||'manual';const{data,error}=await sb.from('customers').insert(rec).select('id').single();if(error)throw error;cur.id=data.id;toast('✅ เพิ่มร้านแล้ว');}
    await loadList(); await openStore(cur.id);
  }catch(e){$('#serr').textContent='บันทึกไม่สำเร็จ: '+(e.message||e);}
  $('#saveBtn').disabled=false;$('#saveBtn').textContent='💾 บันทึกร้าน';
}
async function delStore(){
  if(!confirm('ลบร้านนี้? (ลบไม่ได้ถ้าถูกใช้ใน trip)'))return;
  const{error}=await sb.from('customers').delete().eq('id',cur.id);
  if(error){toast('ลบไม่ได้: '+error.message);return;}
  toast('ลบแล้ว');cur=null;$('#detail').innerHTML='<div class="muted">เลือกร้านจากรายการ</div>';await loadList();
}

/* photos */
async function uploadPhoto(){
  const f=$('#photoFile').files[0];if(!f){toast('เลือกรูปก่อน');return;}
  const ptype=$('#f_ptype').value;const ext=(f.name.split('.').pop()||'jpg').toLowerCase();
  const path=`${cur.id}/${ptype}_${Date.now()}.${ext}`;
  $('#upBtn').disabled=true;$('#upBtn').textContent='...';
  try{
    const{error:ue}=await sb.storage.from('store-photos').upload(path,f,{upsert:false});
    if(ue)throw ue;
    let lat=null,lng=null;try{const p=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{timeout:5000}));lat=p.coords.latitude;lng=p.coords.longitude;}catch(e){}
    const{error:ie}=await sb.from('customer_photos').insert({customer_id:cur.id,photo_type:ptype,file_path:path,lat,lng,taken_at:new Date().toISOString(),taken_by:me.id});
    if(ie)throw ie;
    $('#photoFile').value='';toast('✅ อัปโหลดรูปแล้ว');loadPhotos();
  }catch(e){toast('อัปโหลดไม่สำเร็จ: '+(e.message||e));}
  $('#upBtn').disabled=false;$('#upBtn').textContent='อัปโหลด';
}
async function loadPhotos(){
  const{data,error}=await sb.from('customer_photos').select('*').eq('customer_id',cur.id).order('created_at',{ascending:false});
  if(error){$('#photos').innerHTML='<span class="muted">โหลดรูปไม่ได้</span>';return;}
  if(!data.length){$('#photos').innerHTML='<span class="muted">ยังไม่มีรูป</span>';return;}
  const signed=await Promise.all(data.map(p=>sb.storage.from('store-photos').createSignedUrl(p.file_path,3600)));
  $('#photos').innerHTML=data.map((p,i)=>`<div class="ph">
    <img src="${signed[i].data?signed[i].data.signedUrl:''}" alt="">
    <div class="cap">${esc(p.photo_type)}</div>
    <div class="del" data-del="${p.id}" data-path="${esc(p.file_path)}">ลบ</div></div>`).join('');
  $$('#photos .del').forEach(b=>b.onclick=async()=>{
    if(!confirm('ลบรูปนี้?'))return;
    await sb.storage.from('store-photos').remove([b.dataset.path]);
    await sb.from('customer_photos').delete().eq('id',b.dataset.del);
    toast('ลบรูปแล้ว');loadPhotos();
  });
}
/* orders */
async function addOrder(){
  const rec={customer_id:cur.id,order_date:val('oDate')||new Date().toISOString().slice(0,10),
    amount:num('oAmt'),payment_status:$('#f_oPay').value,items_note:val('oNote'),created_by:me.id};
  const{error}=await sb.from('customer_orders').insert(rec);
  if(error){toast('เพิ่มไม่ได้: '+error.message);return;}
  $('#f_oAmt').value='';$('#f_oNote').value='';toast('✅ บันทึกยอดแล้ว');loadOrders();
}
async function loadOrders(){
  const{data,error}=await sb.from('customer_orders').select('*').eq('customer_id',cur.id).order('order_date',{ascending:false}).limit(50);
  if(error){$('#orders').innerHTML='';return;}
  if(!data.length){$('#orders').innerHTML='<span class="muted">ยังไม่มีบันทึก</span>';return;}
  const total=data.reduce((s,o)=>s+(+o.amount||0),0);
  $('#orders').innerHTML=`<div class="muted" style="font-size:12px;margin-bottom:4px">รวม ${data.length} ครั้ง · ${total.toLocaleString()}</div>`+
    data.map(o=>`<div class="ordrow"><span>${o.order_date}</span><span style="flex:1">${esc(o.items_note||'')}</span>
      <b>${(+o.amount||0).toLocaleString()}</b><span class="badge">${esc(o.payment_status||'')}</span>
      <span class="del" data-o="${o.id}" style="color:var(--bad);cursor:pointer">✕</span></div>`).join('');
  $$('#orders .del').forEach(b=>b.onclick=async()=>{await sb.from('customer_orders').delete().eq('id',b.dataset.o);loadOrders();});
}
function esc(s){return(s==null?'':String(s)).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
let tT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),2600);}
</script>
<script>if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});</script>
